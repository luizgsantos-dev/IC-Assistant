<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC-UFMT Smart Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="new-chat-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Nova Conversa
                </button>
            </div>
            <div class="sidebar-content">
                <div class="provider-info" id="provider-info">
                    <div class="info-label">Provedor LLM</div>
                    <div class="info-value" id="llm-provider">Carregando...</div>
                    <div class="info-label">Modelo</div>
                    <div class="info-value" id="llm-model">-</div>
                    <div class="info-label">Documentos</div>
                    <div class="info-value" id="doc-count">-</div>
                </div>
            </div>
            <div class="sidebar-footer">
                <a href="#" id="refresh-docs-btn" class="sidebar-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                    Atualizar Documentos
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <button id="sidebar-toggle" class="sidebar-toggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1>IC-UFMT Smart Agent</h1>
                <div class="connection-status" id="connection-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Conectando...</span>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="chat-area" id="chat-area">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                            <path d="M2 17l10 5 10-5"></path>
                            <path d="M2 12l10 5 10-5"></path>
                        </svg>
                    </div>
                    <h2>Assistente do Instituto de Computacao</h2>
                    <p>Tire suas duvidas sobre processos academicos, administrativos e informacoes do IC-UFMT.</p>
                    
                    <div class="suggestions">
                        <button class="suggestion-btn" data-question="Como funciona o aproveitamento de materias?">
                            Como funciona o aproveitamento de materias?
                        </button>
                        <button class="suggestion-btn" data-question="Quais sao os requisitos para graduacao?">
                            Quais sao os requisitos para graduacao?
                        </button>
                        <button class="suggestion-btn" data-question="Como solicito material de escritorio pelo SEI?">
                            Como solicito material de escritorio pelo SEI?
                        </button>
                        <button class="suggestion-btn" data-question="Quais laboratorios de pesquisa existem no IC?">
                            Quais laboratorios de pesquisa existem no IC?
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div class="messages-container" id="messages-container"></div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        id="message-input" 
                        placeholder="Digite sua pergunta..." 
                        rows="1"
                        autofocus
                    ></textarea>
                    <button id="send-btn" class="send-btn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">Pressione Enter para enviar, Shift+Enter para nova linha</p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
